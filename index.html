<!doctype html>
<html lang="it">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>D.C.C.</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Space+Grotesk:wght@400;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <canvas id="network"></canvas>
        <header class="topbar">
            <div class="brand">D.C.C.</div>
            <button id="burger">☰</button>
            <nav id="menu">
                <a href="#about">About</a><a href="#signals">Signals</a><a href="#gallery">Frames</a
                ><a href="#voices">Echoes</a><a href="#contact">Contact</a><button onclick="setLang('it')">IT</button
                ><button onclick="setLang('en')">EN</button>
            </nav>
        </header>
        <section class="hero">
            <div>
                <h1>D.C.C.</h1>
                <p
                    data-it="Visioni sotterranee. Paesaggi interiori. Frammenti di luce."
                    data-en="Underground visions. Inner landscapes. Fragments of light."
                >
                    Visioni sotterranee. Paesaggi interiori. Frammenti di luce.
                </p>
            </div>
        </section>
        <section id="about" class="panel">
            <h2>About</h2>
            <p
                data-it="Non tutto deve essere spiegato. Alcune presenze restano sospese tra luce, memoria e trasformazione."
                data-en="Not everything needs explanation. Some presences remain suspended between light, memory and transformation."
            >
                Non tutto deve essere spiegato.
            </p>
        </section>
        <section id="signals" class="panel glass">
            <h2>Signals</h2>
            <div class="cards">
                <article>
                    <h3>Psychology</h3>
                    <p
                        data-it="Le parole arrivano dopo. Le sensazioni quasi sempre prima."
                        data-en="Words arrive later. Sensations usually come first."
                    ></p>
                </article>
                <article>
                    <h3>Motivation</h3>
                    <p
                        data-it="Il cambiamento inizia spesso senza rumore."
                        data-en="Change often starts without noise."
                    ></p>
                </article>
                <article>
                    <h3>Wellbeing</h3>
                    <p data-it="Respirare, osservare, rallentare." data-en="Breathe, observe, slow down."></p>
                </article>
                <article>
                    <h3>Psychedelia</h3>
                    <p data-it="Non evasione. Prospettiva." data-en="Not escape. Perspective."></p>
                </article>
            </div>
        </section>
        <section id="gallery" class="panel">
            <h2 data-it="Frammenti" data-en="Fragments">Frammenti</h2>
            <div class="gallery">
                <div class="img a"></div>
                <div class="img b"></div>
                <div class="img c"></div>
            </div>
        </section>
        <section id="voices" class="panel glass">
            <h2 data-it="Echi" data-en="Voices">Echi</h2>
            <p
                data-it="Conversazioni. Appunti. Collaborazioni. Voci."
                data-en="Conversations. Notes. Collaborations. Voices more than headlines."
            ></p>
        </section>
        <section id="contact" class="panel">
            <h2 data-it="Contatto" data-en="Contact">Contatto</h2>
			<p
                data-it="Da qualche parte tra conversazione, sperimentazione e trasformazione silente."
                data-en="Somewhere between conversation, experimentation and quiet transformation."
            ></p>
            <br />
            <p data-it="Milan · Italy" data-en="Milan · Italy"></p>
            <p data-it="email@email.com" data-en="email@email.com"></p>
            <p
                data-it="Per appuntamento. Per intuizione. Per risonanza."
                data-en="By appointment. By intuition. By resonance."
            ></p>

            <form id="contactForm" class="contact-form">
                <input type="text" id="name" placeholder="Your Name" required />

                <input type="email" id="email" placeholder="Your Email" required />

                <textarea id="message" rows="6" placeholder="Your Message" required></textarea>

                <button type="submit">Send Message</button>

                <div id="formStatus"></div>
            </form>
        </section>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser.min.jsscript"></script>
		<script src="js/app.js"></script>
    </body>
</html>
